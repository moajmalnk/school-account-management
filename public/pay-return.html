<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Returning to Feezo</title>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var orderId = (params.get("order_id") || "").trim();
        var next = params.get("next") || "/family/fees";
        var tab = params.get("tab") || "";
        if (next !== "/family/fees" && next !== "/tenant/settings") next = "/family/fees";
        if (!/^[A-Za-z0-9_-]{4,50}$/.test(orderId)) orderId = "";
        var target = new URL(next, window.location.origin);
        if (next === "/tenant/settings") {
          target.searchParams.set("tab", /^[a-z0-9-]{1,40}$/.test(tab) ? tab : "subscription");
        }
        if (orderId) target.searchParams.set("order_id", orderId);
        var href = target.toString();
        var payload = { type: "feezo-pay-return", href: href };
        try {
          if (window.top && window.top !== window) {
            window.top.postMessage(payload, window.location.origin);
            window.top.location.replace(href);
            return;
          }
        } catch (err) {
          try {
            window.parent.postMessage(payload, window.location.origin);
          } catch (ignore) {}
        }
        window.location.replace(href);
      })();
    </script>
  </head>
  <body style="margin:0;min-height:100vh;display:grid;place-items:center;background:#0B3D3A;color:#fff;font-family:Inter,ui-sans-serif,system-ui,sans-serif">
    <p>Returning to Feezo…</p>
  </body>
</html>
