    <style>
      html,body{margin:0;background:#fff;color:#1a1c2c;font-family:Inter,ui-sans-serif,system-ui,sans-serif}
      #root{min-height:100vh}
      #boot-shell{position:fixed;inset:0;z-index:40;overflow:auto;background:#fff;pointer-events:none}
      #boot-shell .boot-inner{max-width:64rem;margin:0 auto;padding:4.75rem 1.25rem 2rem;text-align:center}
      #boot-shell h1{margin:0;font-size:clamp(2.75rem,8vw,5.25rem);line-height:1.08;font-weight:800;letter-spacing:-0.02em;color:#1a1c2c}
      #boot-shell h1 span{color:#3f7a1f}
      #boot-shell img{display:block;width:min(100%,1040px);height:auto;margin:2rem auto 0;aspect-ratio:16/9;object-fit:contain}
      #boot-shell p{max-width:32rem;margin:1.5rem auto 0;font-size:clamp(1rem,2.4vw,1.375rem);font-weight:500;line-height:1.35;color:#1a1c2c}
      #boot-shell.is-done{opacity:0;transition:opacity .2s ease}
    </style>
    <link rel="preload" as="image" href="/home/explode-start-720.webp" type="image/webp" fetchpriority="high" />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
    />

      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      />
    </noscript>
    <script>
      (function () {
        function loadExtraFonts() {
          var link = document.createElement("link");
          link.rel = "stylesheet";
          link.href =
            "https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=JetBrains+Mono:wght@400;500;600&display=swap";
          document.head.appendChild(link);
        }
        if ("requestIdleCallback" in window) {
          requestIdleCallback(loadExtraFonts, { timeout: 4000 });
        } else {
          window.addEventListener("load", function () {
            setTimeout(loadExtraFonts, 1200);
          });
        }
      })();
    </script>
    <script>
      (function () {
        function loadGtm() {
          window.dataLayer = window.dataLayer || [];
          function gtag() {
            dataLayer.push(arguments);
          }
          window.gtag = gtag;
          gtag("js", new Date());
          var s = document.createElement("script");
          s.async = true;
          s.src = "https://www.googletagmanager.com/gtm.js?id=GTM-P8CZ33ZN";
          document.head.appendChild(s);
        }
        if (document.readyState === "complete") {
          setTimeout(loadGtm, 1500);
        } else {
          window.addEventListener("load", function () {
            setTimeout(loadGtm, 1500);
          });
        }
      })();
    </script>
  </head>
  <body class="bg-white antialiased">
    <div id="boot-shell" hidden>
      <div class="boot-inner">
        <h1>Welcome To<br /><span>Feezo</span></h1>
        <img
          src="/home/explode-start-720.webp"
          width="720"
          height="405"
          alt="Feezo tenant dashboard with income, expenses, and cash position"
          fetchpriority="high"
          decoding="async"
        />
        <p>Fees, receipts, follow-ups, &amp; school accounts in one clear platform ready in minutes.</p>
      </div>
    </div>
    <div id="root"></div>
    <script>
      (function () {
        var path = location.pathname || "/";
        var isMarketing = path === "/" || path === "/home" || path === "/index.html";
        var shell = document.getElementById("boot-shell");
        if (!shell) return;
        if (!isMarketing) {
          shell.remove();
          return;
        }
        shell.hidden = false;
        window.__feezoDismissBootShell = function () {
          if (!shell || shell.classList.contains("is-done")) return;
          shell.classList.add("is-done");
          window.setTimeout(function () {
            shell.remove();
          }, 220);
        };
      })();
    </script>
    <noscript>
      <main>
        <h1>Feezo · School accounts simplified</h1>
        <p>
          Fees, receipts, follow-ups, and school accounts in one place. Feezo is a mini ERP for
          schools, operated by MAC ADZ in Malappuram, Kerala.
        </p>
        <p>
          <a href="/signup/school">Start a 14-day trial</a>
          ·
          <a href="/contact">Contact</a>
          ·
          <a href="/download">Download the app</a>
        </p>
      </main>
    </noscript>
    <script>
      (function () {
        var ua = navigator.userAgent || "";
        if (!/googlebot|google-inspectiontool|adsbot-google|bingbot|duckduckbot|baiduspider|yandex|slurp/i.test(ua)) {
          return;
        }
        if (!("serviceWorker" in navigator)) return;
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          if (!regs.length) return;
          return Promise.all(
            regs.map(function (reg) {
              return reg.unregister();
            }),
          ).then(function () {
            try {
              if (sessionStorage.getItem("feezo-bot-sw-cleared")) return;
              sessionStorage.setItem("feezo-bot-sw-cleared", "1");
            } catch (e) {
              return;
            }
            location.reload();
          });
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
