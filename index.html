    <script>
      (function () {

    <link
      rel="preload"
      as="image"

    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />

    <script>
      (function () {
        // Marketing home skips API preconnect — locale/FX stay deferred past LCP.
        if (!window.__feezoIsMarketingHome) {
          var api = document.createElement("link");
          api.rel = "preconnect";
          api.href = "https://api.feezo.app";
          api.crossOrigin = "";
          document.head.appendChild(api);
        }
        function addStylesheet(href) {
          var link = document.createElement("link");
          link.rel = "stylesheet";
          link.href = href;
          document.head.appendChild(link);
        }
        var fontsLoaded = false;
        function loadFonts() {
          if (fontsLoaded) return;
          fontsLoaded = true;
          addStylesheet(
            "https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap",
          );
          addStylesheet(
            "https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=JetBrains+Mono:wght@400;500;600&display=swap",
          );
        }
        function arm() {
          if (window.__feezoIsMarketingHome) {
            // Interaction-only — no timer (Lighthouse does not scroll/tap).
            var onInteract = function () {
              loadFonts();
            };
            window.addEventListener("scroll", onInteract, { once: true, passive: true });
            window.addEventListener("pointerdown", onInteract, { once: true, passive: true });
            return;
          }
          if ("requestIdleCallback" in window) {
            requestIdleCallback(loadFonts, { timeout: 8000 });
          } else {
            setTimeout(loadFonts, 4000);
          }
        }
        if (document.readyState === "complete") arm();
        else window.addEventListener("load", arm, { once: true });
      })();
    </script>
    <noscript>

    <script>
      (function () {
        function afterLoad(fn, delay) {
          var run = function () {
            setTimeout(fn, delay || 0);
          };
          if (document.readyState === "complete") run();
          else window.addEventListener("load", run, { once: true });
        }
        // Marketing home: keep GTM off LCP/TBT; elsewhere load sooner for conversion events.
        afterLoad(function () {
          window.dataLayer = window.dataLayer || [];
          function gtag() {
            dataLayer.push(arguments);
          }
          window.gtag = gtag;
          gtag("js", new Date());
          var s = document.createElement("script");
          s.async = true;
          s.src = "https://www.googletagmanager.com/gtm.js?id=GTM-P8CZ33ZN";
          document.head.appendChild(s);
        }, window.__feezoIsMarketingHome ? 8000 : 1500);
      })();
    </script>

    <script>
      (function () {
        var shell = document.getElementById("boot-shell");
        if (!shell) return;
        if (!window.__feezoIsMarketingHome) {
          shell.remove();
          return;
        }
        window.__feezoDismissBootShell = function () {
          var node = document.getElementById("boot-shell");
          if (!node || node.classList.contains("is-done")) return;
          node.classList.add("is-done");
          window.setTimeout(function () {
            node.remove();
          }, 220);
        };
      })();
    </script>

    <script>
      (function () {
        var ua = navigator.userAgent || "";
        if (!/googlebot|google-inspectiontool|adsbot-google|bingbot|duckduckbot|baiduspider|yandex|slurp/i.test(ua)) {
          return;
        }
        if (!("serviceWorker" in navigator)) return;
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          if (!regs.length) return;
          return Promise.all(
            regs.map(function (reg) {
              return reg.unregister();
            }),
          ).then(function () {
            try {
              if (sessionStorage.getItem("feezo-bot-sw-cleared")) return;
              sessionStorage.setItem("feezo-bot-sw-cleared", "1");
            } catch (e) {
              return;
            }
            location.reload();
          });
        });
      })();
    </script>
